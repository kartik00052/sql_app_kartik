<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DSA 500 — A logic-building roadmap through 500 free LeetCode problems, pattern-classified across 25 phases. Track progress, hints, revisions and time — all local, offline, yours.">
<title>DSA 500 — Logic Building Roadmap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131110; --sur:#1b1815; --sur2:#221e19; --bd:#2f2922; --bd2:#3b342b;
  --tx:#ece5d8; --mut:#9b9080; --faint:#6e655a;
  --acc:#e2a13c; --acc-dim:#8a6425;
  --grn:#5cb884; --grn-dim:#2c4a38;
  --red:#e06055; --red-dim:#4d2b28;
  --teal:#5aa8a0; --teal-dim:#27403d;
  --easy:#5cb884; --med:#e2a13c; --hard:#e06055;
  --sh:0 2px 10px rgba(0,0,0,.28);
  --r:10px;
}
html[data-theme="light"]{
  --bg:#f2ede2; --sur:#fdfaf3; --sur2:#f5efe2; --bd:#ddd2bd; --bd2:#c9bda4;
  --tx:#241d12; --mut:#776c5b; --faint:#a2967f;
  --acc:#a86e13; --acc-dim:#e5d3ae;
  --grn:#2f7d4f; --grn-dim:#cfe6d8;
  --red:#b4453c; --red-dim:#f0d3cf;
  --teal:#2c6d67; --teal-dim:#d0e2df;
  --easy:#2f7d4f; --med:#a86e13; --hard:#b4453c;
  --sh:0 2px 8px rgba(60,45,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',ui-serif,Georgia,serif;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,input,textarea{font-family:inherit;color:var(--tx)}
a{color:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ---------- layout ---------- */
#side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--sur);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:40;transition:transform .25s}
#side .brand{padding:22px 20px 16px;border-bottom:1px solid var(--bd)}
#side .brand h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
#side .brand .sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--acc);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
#nav{flex:1;overflow-y:auto;padding:10px 0}
.navsec{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:14px 20px 5px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 20px;font-size:13.5px;color:var(--mut);border-left:2px solid transparent}
.nv:hover{color:var(--tx);background:var(--sur2)}
.nv.on{color:var(--acc);border-left-color:var(--acc);background:var(--sur2);font-weight:600}
.nv .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)}
#side .foot{padding:12px 20px;border-top:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint)}
#main{margin-left:236px;min-height:100vh}
#top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 26px;display:flex;align-items:center;gap:14px}
#burger{display:none;padding:6px}
.searchwrap{flex:1;max-width:560px;display:flex;align-items:center;gap:9px;background:var(--sur);border:1px solid var(--bd);border-radius:8px;padding:8px 13px}
.searchwrap svg{flex:none;color:var(--faint)}
.searchwrap input{flex:1;background:none;border:none;outline:none;font-size:14px}
.searchwrap input::placeholder{color:var(--faint)}
#top .mini{margin-left:auto;display:flex;align-items:center;gap:14px}
#top .mini .bar{width:130px;height:5px;background:var(--sur2);border-radius:3px;overflow:hidden}
#top .mini .bar i{display:block;height:100%;background:var(--grn);transition:width .4s}
#top .mini .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--bd);color:var(--mut)}
.iconbtn:hover{color:var(--tx);border-color:var(--bd2)}
#view{padding:26px;max-width:1180px}
@media(max-width:920px){
  #side{transform:translateX(-100%)} #side.open{transform:none;box-shadow:var(--sh)}
  #main{margin-left:0} #burger{display:grid}
}

/* ---------- shared ---------- */
.card{background:var(--sur);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
h2.vh{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
p.vs{color:var(--mut);font-size:13.5px;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;border:1px solid var(--bd2);background:var(--sur2);font-size:13px;font-weight:500}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#191410;font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:#191410}
.btn.dng{border-color:var(--red);color:var(--red)}
.btn.dng:hover{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2.5px 8px;border-radius:5px;border:1px solid var(--bd2);color:var(--mut);letter-spacing:.02em}
.dE{color:var(--easy);border-color:var(--easy)} .dM{color:var(--med);border-color:var(--med)} .dH{color:var(--hard);border-color:var(--hard)}
.pchip{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2.5px 8px;border-radius:5px;background:var(--sur2);border:1px solid var(--acc-dim);color:var(--acc)}
.cotag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;background:var(--sur2);border:1px solid var(--bd);color:var(--mut)}
.srclnk{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--bd2);color:var(--tx);text-decoration:none}
.srclnk:hover{border-color:var(--acc);color:var(--acc)}
.bar{height:6px;background:var(--sur2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.bar.g i{background:var(--grn)}
.empty{padding:50px 20px;text-align:center;color:var(--faint);font-size:14px}
details.cheat{margin-top:26px}
details.cheat summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);padding:13px 18px;list-style:none;display:flex;align-items:center;gap:10px}
details.cheat summary::before{content:"+";font-size:15px;width:14px}
details.cheat[open] summary::before{content:"−"}
.cheattbl{width:100%;border-collapse:collapse;font-size:13px}
.cheattbl th{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 18px;border-top:1px solid var(--bd)}
.cheattbl td{padding:7px 18px;border-top:1px solid var(--bd)}
.cheattbl td:last-child{color:var(--acc);font-family:'JetBrains Mono',monospace;font-size:12px}

/* ---------- dashboard ---------- */
.hero{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;padding:26px;margin-bottom:18px}
.hero .big{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero .big span{color:var(--faint);font-size:26px}
.hero .pct{font-family:'JetBrains Mono',monospace;color:var(--acc);font-size:14px;margin-top:8px}
.hero .hright{margin-left:auto;text-align:right;color:var(--mut);font-size:12.5px;line-height:1.8}
.hero .hright b{color:var(--tx)}
.strip{display:grid;grid-template-columns:repeat(100,1fr);gap:2px;padding:16px 18px}
.strip i{height:9px;border-radius:2px;background:var(--sur2);cursor:pointer;transition:transform .1s}
.strip i:hover{transform:scale(1.5)}
.strip i.st1{background:var(--teal)} .strip i.st2{background:var(--grn)} .strip i.st3{background:var(--red)}
.strip i.rv{box-shadow:0 0 0 1px var(--acc)}
.striplegend{display:flex;gap:16px;padding:0 18px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);flex-wrap:wrap}
.striplegend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:22px 0}
.stat{padding:14px 16px}
.stat .n{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:600}
.stat .n small{font-size:12px;color:var(--faint);font-weight:400}
.stat .l{font-size:11.5px;color:var(--mut);margin-top:2px}
.stat.g .n{color:var(--grn)} .stat.a .n{color:var(--acc)} .stat.r .n{color:var(--red)} .stat.t .n{color:var(--teal)}
.topicrow{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--bd);cursor:pointer}
.topicrow:first-child{border-top:none}
.topicrow:hover{background:var(--sur2)}
.topicrow .tn{width:210px;font-size:13.5px;font-weight:500;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topicrow .tn small{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);font-weight:400;letter-spacing:.05em}
.topicrow .bar{flex:1}
.topicrow .tv{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mut);width:64px;text-align:right}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:9px;padding:14px 16px;margin-bottom:16px;align-items:center}
.filters select{background:var(--sur2);border:1px solid var(--bd2);border-radius:7px;padding:6px 9px;font-size:12px;font-family:'JetBrains Mono',monospace;outline:none;max-width:190px}
.filters select:hover{border-color:var(--acc)}
.filters label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;flex-direction:column;gap:4px}
.freset{margin-left:auto}
.listhead{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.listhead .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint)}
.brief{padding:12px 16px;border-left:3px solid var(--acc);margin-bottom:16px;font-size:13px;color:var(--mut);font-style:italic}

/* ---------- question cards ---------- */
.q{margin-bottom:9px;overflow:hidden}
.q.st1{border-left:3px solid var(--teal)} .q.st2{border-left:3px solid var(--grn)} .q.st3{border-left:3px solid var(--red)}
.qh{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;user-select:none}
.qh:hover{background:var(--sur2)}
.qnum{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);flex:none;width:34px}
.qmain{flex:1;min-width:0}
.qtitle{font-size:15px;font-weight:600;letter-spacing:-.01em}
.qmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.qco{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
.qchev{flex:none;color:var(--faint);transition:transform .2s}
.q.open .qchev{transform:rotate(180deg)}
.qbody{display:none;border-top:1px solid var(--bd);padding:18px}
.q.open .qbody{display:block}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:16px}
@media(max-width:760px){.qgrid{grid-template-columns:1fr}.qco{display:none}}
.klabel{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:12px 0 5px}
.klabel:first-child{margin-top:0}
.kval{font-size:13.5px}
.callout{padding:10px 13px;border-radius:8px;font-size:13px}
.callout.sk{background:var(--sur2);border-left:3px solid var(--acc)}
.callout.si{background:var(--sur2);border-left:3px solid var(--teal)}
.ctrlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden}
.seg button{padding:6px 13px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--mut);border-right:1px solid var(--bd2)}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--acc);color:#191410;font-weight:600}
.seg button.on[data-st="2"]{background:var(--grn)} .seg button.on[data-st="3"]{background:var(--red)} .seg button.on[data-st="1"]{background:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;font-size:12px;font-family:'JetBrains Mono',monospace;border:1px solid var(--bd2);border-radius:8px;color:var(--mut)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{border-color:var(--grn);color:var(--grn);background:var(--grn-dim)}
.hintzone{margin:6px 0 14px}
.hintrow{padding:9px 13px;border-left:2px solid var(--acc-dim);margin:6px 0;background:var(--sur2);border-radius:0 7px 7px 0;font-size:13px;color:var(--mut)}
.qgrid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:760px){.qgrid2{grid-template-columns:1fr}}
textarea.tnote{width:100%;min-height:74px;background:var(--sur2);border:1px solid var(--bd2);border-radius:8px;padding:10px 12px;font-size:13px;resize:vertical;outline:none}
textarea.tnote:focus{border-color:var(--acc)}
input.tin,select.tin{width:100%;background:var(--sur2);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;font-size:13px;outline:none}
input.tin:focus,select.tin:focus{border-color:var(--acc)}
.timerbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tdisp{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;color:var(--acc)}
.hiddenpat{padding:12px 14px;border:1px dashed var(--bd2);border-radius:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--faint)}
.revpipe{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.revpipe b{color:var(--grn)}

/* ---------- mixed / blind / final ---------- */
.focushead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--bd);flex-wrap:wrap}
.mrow:first-child{border-top:none}
.mrow .mt{flex:1;min-width:200px}
.mrow .mt .t{font-weight:600;font-size:14px}
.mrow .mt .m{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);margin-top:3px}
.scorebig{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:600;color:var(--acc)}

/* ---------- mistakes / settings ---------- */
.mistgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.setrow{display:flex;align-items:center;gap:16px;padding:16px 18px;border-top:1px solid var(--bd);flex-wrap:wrap}
.setrow:first-child{border-top:none}
.setrow .st{flex:1;min-width:220px}
.setrow .st b{font-size:14px}
.setrow .st p{font-size:12.5px;color:var(--mut);margin-top:2px}

/* ---------- toast & modal ---------- */
#toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--sur);border:1px solid var(--acc);color:var(--tx);padding:11px 17px;border-radius:9px;font-size:13px;box-shadow:var(--sh);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;place-items:center;padding:20px}
#modal.open{display:grid}
.mbox{max-width:420px;width:100%;padding:24px}
.mbox h3{font-size:17px;margin-bottom:8px}
.mbox p{color:var(--mut);font-size:13.5px;margin-bottom:18px}
.mbox .acts{display:flex;gap:10px;justify-content:flex-end}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><h1>DSA·500</h1><div class="sub">Logic Building OS</div></div>
  <nav id="nav"></nav>
  <div class="foot">500 problems · 0 premium<br>local · offline · yours</div>
</aside>

<div id="main">
  <header id="top">
    <button id="burger" class="iconbtn" aria-label="Menu"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="searchwrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search: name, number, pattern, company, topic, LC id…">
    </div>
    <div class="mini">
      <div class="lbl" id="toplbl">0 / 500</div>
      <div class="bar"><i id="topbar" style="width:0%"></i></div>
      <button id="themebtn" class="iconbtn" aria-label="Toggle theme"></button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="toasts"></div>
<div id="modal"><div class="mbox card" id="mbox"></div></div>
<input type="file" id="importfile" accept=".json" style="display:none">

<script>
"use strict";
/* ============================================================
   PATTERN LIBRARY — signal, prerequisites, target complexity,
   and a 3-step hint ladder (recognition → direction → final nudge).
   No solutions. Java-flavoured vocabulary throughout.
============================================================ */
function PT(l,sc,pr,cx,sig,h1,h2,h3){return{l,sc,pr,cx,sig,h:[h1,h2,h3]}}
const PAT={
hashmap:PT("HashMap","Array · Complement Lookup","Arrays · HashMap","O(n) · O(n)","You need O(1) “have I seen this?” lookups while scanning.",
 "Could a single pass with a HashMap answer the question?",
 "Store value → index or value → count as you traverse once; check before you insert.",
 "For pair-target problems, look up the complement of the current element before inserting it."),
hashing_count:PT("Frequency Counting","HashMap · Counting","Arrays · HashMap","O(n) · O(n)","The answer depends on how often things occur.",
 "Count first — the structure of the counts usually contains the answer.",
 "Build a frequency map (or int[26]) in one pass, then reason over counts, not elements.",
 "Mark values in place with sign flips or +n offsets when O(1) space is demanded."),
parsing:PT("String Parsing","StringBuilder · Simulation","Strings · StringBuilder","O(n) · O(n)","You must consume a string token by token under format rules.",
 "Break the string into states: skip, sign, digits, separators.",
 "Walk with an index, validate each token, accumulate with StringBuilder or a numeric accumulator.",
 "Guard overflow and leading zeros explicitly at the digit-accumulation step."),
simulation:PT("Simulation","Arrays · State Machine","Arrays · Loops","O(n) · O(1)","The problem describes a deterministic process to replay.",
 "Don’t hunt for a formula — replay the process step by step.",
 "Identify the state carried between steps and update it in one clean loop.",
 "If rules feel concurrent, encode old and new state in one integer while transitioning."),
matrix:PT("Matrix Traversal","2D Arrays · Boundaries","2D Arrays","O(m·n) · O(1)","You must walk or transform a 2D grid by position rules.",
 "Think in boundaries, diagonals (i+j), or coordinate transforms.",
 "Transpose + reflection compose every rotation; boundary shrinking walks spirals.",
 "Use the first row/column as flag storage when O(1) extra space is required."),
prefix_suffix:PT("Prefix × Suffix","Arrays · Precomputation","Arrays · Prefix Sums","O(n) · O(1)","Each position’s answer combines everything before it and after it.",
 "What can a left-to-right pass give, and a right-to-left pass?",
 "One array holds prefix results; a running suffix variable fills answers on the way back.",
 "Watch zeros: decide whether they kill the whole answer or just a segment."),
kadane:PT("Kadane’s Algorithm","DP · Running Sum","Arrays · Running extremes","O(n) · O(1)","You need the best contiguous subarray sum or product.",
 "At each index: extend the current subarray, or restart here?",
 "Keep the best subarray ending at i; the global answer is the max over all i.",
 "For products and circular cases carry both max and min (sign flips), or invert one Kadane pass."),
array_manip:PT("In-place Manipulation","Two Pointers · Reversal","Arrays","O(n) · O(1)","Values must move within the array itself, cheaply.",
 "Look for a reversal-based decomposition instead of shifting.",
 "Segment reversals compose rotations; the index map i→(i+k)%n explains why.",
 "Negation or +n marking turns the array into its own presence set."),
greedy:PT("Greedy (Running Extremes)","Arrays · Invariants","Arrays","O(n) · O(1)","A local choice made with the best-so-far is globally safe.",
 "Which quantity, if tracked while scanning, makes each step safe?",
 "Maintain a running min/max/sum and update the answer monotonically.",
 "Prove safety with an exchange argument: any other choice swaps to yours without loss."),
two_pointers:PT("Two Pointers","Arrays · Convergence","Arrays · Sorting","O(n) · O(1)","Sorted (or sortable) data lets two indices converge on the answer.",

  "Ask which column can legitimately be missing, and decide its default meaning.",

  "A LEFT JOIN that leaves NULLs exposes rows the INNER JOIN silently drops."),
distinct:PT("Deduplication","DISTINCT · Distinct Counts","SQL · Grouping","Grouping scan","The same logical entity can appear many times.",

  "Watch for double-counting when a join fans out rows; dedupe the fan-out first."),
aggregate:PT("Aggregation","GROUP BY + COUNT/SUM/AVG","SQL · Grouping","Grouping scan","One row per group is the contract.",

  "An empty group has no row: if zeros must be visible, build the group from a dimension table."),
having:PT("HAVING","Group-Level Filters","SQL · Grouping","Grouping scan","A condition is judged per group, not per row.",
  "Any filter that needs the aggregate belongs in HAVING, never WHERE.",

  "COUNT(DISTINCT …) inside HAVING turns 'at least N distinct' into one predicate."),
conditional_agg:PT("Conditional Aggregation","CASE Inside Aggregates","SQL · Grouping","Grouping scan","One condition decides what each aggregate counts.",
  "Wrap a CASE WHEN inside SUM/AVG to count only the rows that qualify.",

  "Two mutually exclusive flags add up to the total — a cheap self-check."),
join:PT("INNER JOIN","Pairing on a Key","SQL · Joins","Indexed merge join","Two tables meet on a shared key.",

  "A many-to-one join fans a row out — hide the fan-in before any COUNT."),
left_join:PT("LEFT JOIN","Driving Table + Preserved Rows","SQL · Joins","Indexed merge join","Every row of one table must survive, even with no match.",

    const q={i:Q.length,num:String(Q.length+1).padStart(3,"0"),title:r[0],lc:r[1],d:r[2],pat:r[3],co:r[4]||"",skill:r[5],nc:r[6]||0,cx:r[7]||"",topic:sec.name,phase:sec.phase,topicKey:sec.key,cp:i===sec.rows.length-1&&sec.rows.length>=6};

let P={};

const DEF={s:0,r1:0,r2:0,m:0,h:[0,0,0],sol:0,notes:"",mis:0,learn:"",rem:"",att:0,last:0,sec:0,min:0,rv:0,pid:0};
const get=id=>Object.assign({},DEF,Array.isArray(P[id]?P[id].h:null)?P[id]:(P[id]&&typeof P[id]==="object"?fixEntry(P[id]):{}));
function fixEntry(e){const c=Object.assign({},e);if(!Array.isArray(c.h))c.h=[0,0,0];return c;}
let saveT=null;
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(P));}catch(e){toast("Could not save — localStorage unavailable");}}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(save,350);}
function set(id,patch){P[id]=Object.assign({},DEF,P[id]&&typeof P[id]==="object"?fixEntry(P[id]):{},patch);queueSave();updateTop();}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cos=c=>(c||"").split("").filter(x=>COMAP[x]).map(x=>COMAP[x]);
const pat=q=>PAT[q.pat]||PAT.hashmap;
const cx=q=>q.cx||pat(q).cx;
const tgtTime=q=>q.d===0?"15–25 min":q.d===1?"25–40 min":"40–60 min";
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),320);},2400);}
function fmtSec(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function loggedSec(id){const g=get(id);let t=g.sec+g.min*60;if(TIMERS[id])t+=(Date.now()-TIMERS[id].t0)/1000;return t;}
function logAttempt(id){const g=get(id);set(id,{att:g.att+1,last:Date.now()});}

/* ---------- timers ---------- */
const TIMERS={};
setInterval(()=>{document.querySelectorAll("[data-td]").forEach(el=>{el.textContent=fmtSec(loggedSec(+el.dataset.td));});},500);
function pauseTimer(id){if(!TIMERS[id])return;const el=(Date.now()-TIMERS[id].t0)/1000;delete TIMERS[id];const g=get(id);set(id,{sec:Math.round(g.sec+el)});}
function resetTimer(id){if(TIMERS[id]){delete TIMERS[id];}else{set(id,{sec:0});}updateCardTimerBtns(id);}
function startTimer(id){if(TIMERS[id])return;TIMERS[id]={t0:Date.now()};logAttempt(id);updateCardTimerBtns(id);}
function updateCardTimerBtns(id){const c=document.querySelector('[data-qid="'+id+'"]');if(!c)return;const run=!!TIMERS[id];const b=c.querySelector('[data-act="tpause"]');if(b)b.innerHTML=run?ic("pause")+" Pause":ic("play")+" Start";}
window.addEventListener("beforeunload",()=>{Object.keys(TIMERS).forEach(pauseTimer);if(Object.keys(P).length)save();clearTimeout(saveT);});

/* ---------- stats ---------- */
function stats(){
  const s={done:0,r1:0,r2:0,mast:0,ind:0,hintA:0,revisit:0,attempt:0,week:0};
  const now=Date.now();
  Q.forEach(q=>{const g=get(q.i);
    if(g.s===2||g.m)s.done++;if(g.r1)s.r1++;if(g.r2)s.r2++;if(g.m)s.mast++;
    if(g.sol===1)s.ind++;if(g.sol===2)s.hintA++;if(g.s===3)s.revisit++;if(g.s===1)s.attempt++;
    if(g.last&&now-g.last<6048e5&&(g.s===2||g.m))s.week++;});
  return s;
}
function streak(){
  const days=new Set();Q.forEach(q=>{const g=get(q.i);if(g.last)days.add(new Date(g.last).toDateString());});
  if(!days.size)return null;
  const d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);
  let n=0;while(days.has(d.toDateString())){n++;d.setDate(d.getDate()-1);}
  return n||null;
}
function updateTop(){const s=stats();$("#toplbl").textContent=s.done+" / 500";$("#topbar").style.width=(s.done/5)+"%";}

/* ---------- filtering & sorting ---------- */
function filtered(){
  let arr=Q.slice();
  if(F.topic!=="all")arr=arr.filter(q=>q.topicKey===F.topic);
  if(F.phase!=="all")arr=arr.filter(q=>PHASEGROUPS[q.phase]===F.phase);
  if(F.diff!=="all")arr=arr.filter(q=>DIFFS[q.d]===F.diff);
  if(F.pat!=="all")arr=arr.filter(q=>pat(q).l===F.pat);
  if(F.co!=="all")arr=arr.filter(q=>cos(q.co).includes(F.co));
  if(F.src!=="all")arr=arr.filter(q=>F.src==="NeetCode"?q.nc:true);
  if(F.st!=="all")arr=arr.filter(q=>{const g=get(q.i);return F.st==="Solved"?(g.s===2||g.m):F.st==="Not Started"?(g.s===0&&!g.m):g.s===["Not Started","Attempted","Solved","Revisit"].indexOf(F.st);});
  if(F.rev!=="all")arr=arr.filter(q=>{const g=get(q.i);return F.rev==="r1"?g.r1:F.rev==="r1x"?(!g.r1&&!g.m):F.rev==="r2"?g.r2:F.rev==="r2x"?!g.r2:F.rev==="m"?g.m:g.s===3;});
  if(F.hint!=="all")arr=arr.filter(q=>{const g=get(q.i);return F.hint==="none"?!g.h.some(x=>x):g.h[+F.hint-1]===1;});
  const t=F.q.trim().toLowerCase();
  if(t)arr=arr.filter(q=>q.title.toLowerCase().includes(t)||q.lc===t||q.num===t.padStart(3,"0")||pat(q).l.toLowerCase().includes(t)||q.topic.toLowerCase().includes(t)||q.phase.toLowerCase().includes(t)||cos(q.co).some(c=>c.toLowerCase().includes(t)));
  const cmp={
    cur:(a,b)=>a.i-b.i,
    diff:(a,b)=>a.d-b.d||a.i-b.i,
    pat:(a,b)=>pat(a).l.localeCompare(pat(b).l)||a.i-b.i,
    topic:(a,b)=>a.topicKey.localeCompare(b.topicKey)||a.i-b.i,
    co:(a,b)=>(cos(a.co)[0]||"zz").localeCompare(cos(b.co)[0]||"zz")||a.i-b.i,
    done:(a,b)=>{const ga=get(a.i),gb=get(b.i);return(gb.m*4+gb.s)-(ga.m*4+ga.s)||a.i-b.i;},
    rev:(a,b)=>{const ga=get(a.i),gb=get(b.i);return(gb.r1+gb.r2+gb.m)-(ga.r1+ga.r2+ga.m)||a.i-b.i;}
  }[SORT];
  return arr.sort(cmp);
}

  let h='<h2 class="vh">Mixed Practice</h2><p class="vs">Random problems from topics you have already started — pattern hidden until you reveal it. Nothing here disturbs your saved progress.</p>';

    h+='<div class="card" style="padding:26px"><div style="font-size:15px;margin-bottom:6px"><b>How the pool is built</b></div><p style="color:var(--mut);font-size:13.5px;margin-bottom:18px">Every topic where you have solved at least one problem counts as “started”. If no topic qualifies yet, the whole 500 is used. Choose a difficulty, then draw.</p><div class="ctrlrow">'+
    ["All","Easy","Medium","Hard"].map((d,i)=>'<button class="chip '+(MIXDF===i?"on":"")+'" data-act="mixdf" data-st="'+i+'">'+d+'</button>').join("")+
    '<button class="btn pri" data-act="mixnew">'+ic("dice")+' Draw a problem</button></div></div>';
    return h;
  }
  const q=Q[MIX.cur];
  h+='<div class="focushead"><button class="btn sm" data-act="mixnew">'+ic("dice")+' Next problem</button><span class="tag mono">draw #'+(MIX.seen)+'</span></div>'+cardHTML(q,{open:true,forcePattern:false});
  return h;
}
let MIXDF=0;
function drawMixed(){
  const started=new Set(Q.filter(q=>{const g=get(q.i);return g.s===2||g.m;}).map(q=>q.topicKey));
  let pool=Q.filter(q=>(!started.size||started.has(q.topicKey))&&(MIXDF===0||q.d===MIXDF-1));
  if(!pool.length)pool=Q.filter(q=>MIXDF===0||q.d===MIXDF-1);
  if(!pool.length){toast("No problems at that difficulty");return;}
  let q=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1)while(q.i===MIX.cur?.i||q.i===MIX.cur)q=pool[Math.floor(Math.random()*pool.length)]||q;
  MIX.cur=q.i;MIX.seen++;
  EXP.add(q.i);render();
}
function renderF50(){
  let h='<h2 class="vh">Final Revision Set — 50 problems</h2><p class="vs">A balanced spread across every major pattern. Work through it with the Revision 1 → Revision 2 → Mastered pipeline.</p>';
  const done=inF50.filter(q=>{const g=get(q.i);return g.s===2||g.m;}).length,mast=inF50.filter(q=>get(q.i).m).length;
  h+='<div class="card" style="padding:20px;margin-bottom:16px"><div style="display:flex;gap:30px;flex-wrap:wrap;margin-bottom:14px"><div><div class="scorebig">'+done+'<small style="font-size:14px;color:var(--faint)"> / 50</small></div><div style="font-size:11.5px;color:var(--mut)">solved</div></div><div><div class="scorebig" style="color:var(--grn)">'+mast+'<small style="font-size:14px;color:var(--faint)"> / 50</small></div><div style="font-size:11.5px;color:var(--mut)">mastered</div></div></div><div class="bar g"><i style="width:'+(mast/50*100)+'%"></i></div></div>';
  h+='<div class="card">'+inF50.map(q=>{const g=get(q.i);
    return'<div class="mrow"><div class="mt"><div class="t">#'+q.num+' · '+esc(q.title)+'</div><div class="m">'+DIFFS[q.d]+' · '+esc(pat(q).l)+' · '+esc(q.topic)+'</div></div>'+
    '<button class="chip '+(g.r1?"on":"")+'" data-act="r1">R1</button><button class="chip '+(g.r2?"on":"")+'" data-act="r2">R2</button><button class="chip '+(g.m?"on":"")+'" data-act="m">M</button>'+
    '<button class="btn sm" data-act="open" data-id="'+q.i+'">Open</button></div>';}).join("")+'</div>';
  return h;
}
function renderBlind(){
  const ident=inB30.filter(q=>get(q.i).pid).length,rev=inB30.filter(q=>get(q.i).rv).length;
  let h='<h2 class="vh">Blind Pattern Test — 30 problems</h2><p class="vs">Patterns and hints are hidden. Read the problem, decide the pattern in your head (or on paper), reveal, and honestly tick whether you identified it.</p>';
  h+='<div class="card" style="padding:20px;margin-bottom:16px;display:flex;gap:30px;flex-wrap:wrap"><div><div class="scorebig">'+ident+'<small style="font-size:14px;color:var(--faint)"> / 30</small></div><div style="font-size:11.5px;color:var(--mut)">pattern identified</div></div><div><div class="scorebig" style="color:var(--teal)">'+rev+'<small style="font-size:14px;color:var(--faint)"> / 30</small></div><div style="font-size:11.5px;color:var(--mut)">revealed so far</div></div></div>';
  h+='<div class="card">'+inB30.map(q=>{const g=get(q.i);
    return'<div class="mrow"><div class="mt"><div class="t">#'+q.num+' · '+esc(q.title)+'</div><div class="m">'+DIFFS[q.d]+' · LC '+q.lc+' · '+(g.rv?esc(pat(q).l):'pattern hidden')+'</div></div>'+
    (g.rv?"":'<button class="btn sm" data-act="reveal">'+ic("eye")+' Reveal</button>')+
    '<button class="chip '+(g.pid?"on":"")+'" data-act="pid">I identified it</button>'+
    '<button class="btn sm" data-act="open" data-id="'+q.i+'">Open</button></div>';}).join("")+'</div>';
  return h;
}
const MIS=["—","Pattern Recognition","Logic","Complexity","Edge Case","Implementation","Java Syntax","Misread Problem","Other"];
function renderMist(){
  const rows=Q.filter(q=>{const g=get(q.i);return g.mis>0||g.learn||g.rem;});
  const agg={};rows.forEach(q=>{const m=get(q.i).mis;if(m>0)agg[m]=(agg[m]||0)+1;});
  let h='<h2 class="vh">Mistake Tracker</h2><p class="vs">Every logged mistake, what it taught you, and what to remember next time. The distribution tells you what to drill.</p>';
  h+='<div class="mistgrid">'+Object.keys(agg).map(k=>'<div class="card stat r"><div class="n">'+agg[k]+'</div><div class="l">'+MIS[k]+'</div></div>').join("")+(rows.length?"":'<div class="card stat"><div class="n">0</div><div class="l">mistakes logged</div></div>')+'</div>';
  if(!rows.length)return h+'<div class="card empty">No mistakes logged yet. Set a mistake type on any problem card — honesty here is what makes the system work.</div>';
  h+='<div class="card">'+rows.map(q=>{const g=get(q.i);
    return'<div class="mrow"><div class="mt"><div class="t">#'+q.num+' · '+esc(q.title)+'</div><div class="m">'+MIS[g.mis]+(g.learn?' · learned: '+esc(g.learn):"")+(g.rem?' · remember: '+esc(g.rem):"")+'</div></div><button class="btn sm" data-act="open" data-id="'+q.i+'">Open</button></div>';}).join("")+'</div>';
  return h;
}
function renderSettings(){
  let bytes=0;try{bytes=(localStorage.getItem(LSKEY)||"").length;}catch(e){}
  return'<h2 class="vh">Settings</h2><p class="vs">Theme, backups, and a hard reset. Your progress lives only in this browser — export regularly.</p>'+
  '<div class="card">'+
  '<div class="setrow"><div class="st"><b>Theme</b><p>Dark by default; light for bright rooms.</p></div><button class="btn" data-act="theme">Toggle theme</button></div>'+
  '<div class="setrow"><div class="st"><b>Export progress</b><p>Downloads a JSON snapshot — e.g. dsa400-progress-'+new Date().toISOString().slice(0,10)+'.json</p></div><button class="btn" data-act="export">'+ic("dl")+' Export</button></div>'+
  '<div class="setrow"><div class="st"><b>Import progress</b><p>Restore a previous snapshot. Replaces current progress.</p></div><button class="btn" data-act="import">'+ic("up")+' Import</button></div>'+
  '<div class="setrow"><div class="st"><b>Reset all progress</b><p>Wipes every status, revision, note and timer. Cannot be undone.</p></div><button class="btn dng" data-act="reset">Reset everything</button></div>'+
  '<div class="setrow"><div class="st"><b>Storage</b><p>Progress currently occupies '+(bytes/1024).toFixed(1)+' KB of localStorage.</p></div><span class="tag mono">'+Q.length+' questions · 0 premium</span></div>'+
  '<div class="setrow"><div class="st"><b>About the data</b><p>All 500 are free, unique, pattern-classified LeetCode problems with historically reported company tags and no solutions anywhere. Source buttons appear only where a page verifiably exists: LeetCode for all, NeetCode for those in its curated sets.</p></div></div>'+
  '</div>';
}
function render(){
  renderNav();
  const v={dash:renderDash,list:renderList,pat:renderPatterns,mixed:renderMixed,f50:renderF50,blind:renderBlind,mist:renderMist,settings:renderSettings}[VIEW]||renderDash;
  $("#view").innerHTML=v();
  updateTop();
  $("#side").classList.remove("open");
}

/* ---------- events ---------- */
 $("#nav").addEventListener("click",e=>{
  const b=e.target.closest("[data-nav]");if(!b)return;
  const v=b.dataset.nav,rv=b.dataset.rev;
  if(rv){F.rev=rv;VIEW="list";}
  else{if(VIEW==="list"&&v==="list")F.rev="all";VIEW=v;if(v!=="list")F.rev="all";}
  render();window.scrollTo(0,0);
});
 $("#view").addEventListener("click",e=>{
  const tick=e.target.closest("[data-tick]");
  if(tick){const id=+tick.dataset.tick;F={topic:Q[id].topicKey,phase:"all",diff:"all",pat:"all",co:"all",src:"all",st:"all",rev:"all",hint:"all",q:""};VIEW="list";EXP.add(id);render();setTimeout(()=>{const el=document.querySelector('[data-qid="'+id+'"]');if(el)el.scrollIntoView({block:"center"});},50);return;}
  const tr=e.target.closest("[data-topic]");
  if(tr){F.topic=tr.dataset.topic;F.rev="all";VIEW="list";render();window.scrollTo(0,0);return;}
  const act=e.target.closest("[data-act]");
  if(!act)return;
  const a=act.dataset.act;
  const card=e.target.closest("[data-qid]"),id=card?+card.dataset.qid:null;
  if(a==="clearf"){F={topic:"all",phase:"all",diff:"all",pat:"all",co:"all",src:"all",st:"all",rev:"all",hint:"all",q:""};$("#search").value="";render();return;}
  if(a==="mixnew"){drawMixed();return;}
  if(a==="mixdf"){MIXDF=+act.dataset.st;render();return;}
  if(a==="open"){VIEW="list";F={topic:"all",phase:"all",diff:"all",pat:"all",co:"all",src:"all",st:"all",rev:"all",hint:"all",q:""};EXP.add(+act.dataset.id);render();setTimeout(()=>{const el=document.querySelector('[data-qid="'+act.dataset.id+'"]');if(el)el.scrollIntoView({block:"center"});},50);return;}
  if(a==="theme"){toggleTheme();return;}
  if(a==="export"){doExport();return;}
  if(a==="import"){$("#importfile").click();return;}
  if(a==="reset"){askReset();return;}
  if(id===null)return;
  const g=get(id);
  if(a==="tog"){EXP.has(id)?EXP.delete(id):EXP.add(id);render();return;}
  if(a==="reveal"){set(id,{rv:1});render();return;}
  if(a==="st"){const v=+act.dataset.st;const patch={s:v,last:Date.now()};if(v>0&&g.att===0)patch.att=1;set(id,patch);render();return;}
  if(a==="sol"){set(id,{sol:+act.dataset.st});render();return;}
  if(a==="r1"){set(id,{r1:g.r1?0:1});render();return;}
  if(a==="r2"){set(id,{r2:g.r2?0:1});render();return;}
  if(a==="m"){set(id,{m:g.m?0:1});render();return;}
  if(a==="pid"){set(id,{pid:g.pid?0:1});render();return;}
  if(a==="hint"){const n=+act.dataset.h;const h=g.h.slice();h[n]=h[n]?0:1;set(id,{h});render();return;}
  if(a==="att"){logAttempt(id);render();return;}
  if(a==="tpause"){TIMERS[id]?pauseTimer(id):startTimer(id);render();return;}
  if(a==="treset"){resetTimer(id);render();return;}
});
 $("#view").addEventListener("input",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.field)return;
  const card=el.closest("[data-qid]");if(!card)return;
  const id=+card.dataset.qid,f=el.dataset.field,v=el.value;
  if(f==="min"){set(id,{min:Math.max(0,Math.floor(+v||0))});return;}
  const g=get(id);const patch={};patch[f]=v;set(id,patch);
});
 $("#view").addEventListener("change",e=>{
  const el=e.target;if(!el.dataset)return;
  // filter dropdowns (data-f)
  if(el.dataset.f){
    if(el.dataset.f==="sort"){SORT=el.value;render();return;}
    const map={topic:"topic",phase:"phase",diff:"diff",pat:"pat",co:"co",src:"src",st:"st",rev:"rev",hint:"hint"};
    const f=map[el.dataset.f];if(!f)return;
    let v=el.value;
    if(f==="topic"){const t=TOPICS.find(t=>t.name===v);v=t?t.key:"all";}
    F[f]=v;render();return;
  }
  // card-level fields (data-field)
  if(!el.dataset.field)return;
  const card=el.closest("[data-qid]");if(!card)return;
  const id=+card.dataset.qid,f=el.dataset.field;
  if(f==="mis"){set(id,{mis:+el.value});updateTop();}
});
 $("#search").addEventListener("input",e=>{
  F.q=e.target.value;
  if(VIEW!=="list"){VIEW="list";F.rev="all";}
  const y=window.scrollY;render();
});
 $("#burger").addEventListener("click",()=>$("#side").classList.toggle("open"));
 $("#themebtn").addEventListener("click",toggleTheme);
function toggleTheme(){
  const cur=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=cur;
  try{localStorage.setItem("dsa400_theme",cur);}catch(e){}
  $("#themebtn").innerHTML=cur==="dark"?ic("sun"):ic("moon");
}
function doExport(){
  const blob=new Blob([JSON.stringify({app:"dsa400",version:1,exportedAt:new Date().toISOString(),progress:P},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="dsa400-progress-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),600);toast("Progress exported");
}
 $("#importfile").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      const pr=o&&o.progress&&typeof o.progress==="object"?o.progress:(o&&typeof o==="object"&&!Array.isArray(o)&&Object.keys(o).length&&("s" in (Object.values(o)[0]||{}))?o:null);
      if(!pr||typeof pr!=="object")throw 0;
      const clean={};
      Object.keys(pr).forEach(k=>{const n=+k;if(!Q[n])return;const x=pr[k]||{};clean[n]={s:x.s|0,r1:x.r1?1:0,r2:x.r2?1:0,m:x.m?1:0,h:[x.h&&x.h[0]?1:0,x.h&&x.h[1]?1:0,x.h&&x.h[2]?1:0],sol:x.sol|0,notes:String(x.notes||""),mis:x.mis|0,learn:String(x.learn||""),rem:String(x.rem||""),att:x.att|0,last:+x.last||0,sec:+x.sec||0,min:+x.min||0,rv:x.rv?1:0,pid:x.pid?1:0};});
      P=clean;save();render();toast("Progress imported — "+Object.keys(clean).length+" problems restored");
    }catch(err){toast("Import failed — not a valid dsa400 export file");}
    e.target.value="";
  };
  fr.readAsText(file);
});
function askReset(){
  $("#mbox").innerHTML='<h3>Reset all progress?</h3><p>This wipes every status, revision, hint log, note, mistake and timer for all 500 problems. There is no undo — export first if in doubt.</p><div class="acts"><button class="btn" data-act="mcancel">Cancel</button><button class="btn dng" data-act="mconfirm">Yes, reset everything</button></div>';
  $("#modal").classList.add("open");
}
 $("#modal").addEventListener("click",e=>{
  if(e.target.id==="modal"){$("#modal").classList.remove("open");return;}
  const act=e.target.closest("[data-act]");if(!act)return;
  const a=act.dataset.act;
  if(a==="mcancel"){$("#modal").classList.remove("open");return;}
  if(a==="mconfirm"){$("#modal").classList.remove("open");P={};save();EXP.clear();MIX={cur:null,seen:0};render();toast("All progress reset");return;}
});

/* ---------- init ---------- */
try{const t=localStorage.getItem("dsa400_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
 $("#themebtn").innerHTML=document.documentElement.dataset.theme==="light"?ic("moon"):ic("sun");
render();
console.log("DSA·400 ready — "+Q.length+" questions, "+TOPICS.length+" topics, checkpoints: "+Q.filter(q=>q.cp).length);
</script>
